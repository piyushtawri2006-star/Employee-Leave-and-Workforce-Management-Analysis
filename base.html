<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workforce Management</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--ink:#14233b;--teal:#0f9f9a;--teal-soft:#d8f4f0;--coral:#ee6c4d;--gold:#f3b544;--paper:#f5f7f8;--line:#dce5e8;--muted:#667085;--white:#fff;--shadow:0 18px 50px rgba(20,35,59,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;letter-spacing:0}body:before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--teal),var(--gold),var(--coral))}
nav{background:var(--ink);color:var(--white);padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:26px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:21px;font-weight:bold}.brand-mark{display:grid;place-items:center;width:35px;height:35px;background:var(--teal);border-radius:10px;color:var(--ink);font-family:Verdana,sans-serif;font-weight:900}.brand small{display:block;color:#a9bdc8;font-family:"Trebuchet MS",sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}.links{display:flex;align-items:center;gap:4px}.links a{color:#cbd8df;text-decoration:none;padding:9px 11px;border-radius:8px;font-size:13px;transition:.2s}.links a:hover,.links a.active{background:#29415b;color:#fff}.nav-toggle{display:none;background:transparent;border:1px solid #446079;color:#fff;padding:8px 10px;border-radius:7px}
main{width:90%;max-width:1240px;margin:34px auto 54px;min-height:70vh}.page-kicker{color:var(--teal);font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:1.8px;margin:0 0 8px}.page-title{font-family:Georgia,serif;font-size:38px;line-height:1.05;margin:0 0 8px}.page-subtitle{color:var(--muted);margin:0 0 26px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:var(--white);padding:22px;border:1px solid rgba(220,229,232,.7);border-radius:16px;box-shadow:var(--shadow)}.card{position:relative;overflow:hidden}.card:after{content:"";position:absolute;right:-25px;bottom:-35px;width:95px;height:95px;border:18px solid var(--teal-soft);border-radius:50%}.card-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.card strong{display:block;font-family:Georgia,serif;font-size:38px;margin-top:10px;position:relative;z-index:1}.card .metric-note{color:var(--teal);font-size:12px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.title-row h1{margin:0;font-family:Georgia,serif;font-size:34px}.panel h2{font-family:Georgia,serif;margin:0 0 16px;font-size:22px}.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn,button{background:var(--teal);color:#fff;border:0;padding:10px 15px;border-radius:8px;text-decoration:none;cursor:pointer;font-weight:bold;transition:transform .18s,box-shadow .18s,background .18s}.btn:hover,button:hover{background:#0a817d;transform:translateY(-1px);box-shadow:0 7px 18px rgba(15,159,154,.2)}.secondary{background:#64748b}.danger{background:var(--coral)}.inline{display:inline}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--white);margin-top:15px;overflow:hidden;border:1px solid var(--line);border-radius:12px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left}th{background:#edf2f3;color:#4c5d68;font-size:11px;letter-spacing:.8px;text-transform:uppercase}tr:last-child td{border-bottom:0}tbody tr:hover,tr:hover td{background:#f7fbfb}.status,.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:bold}.status-Active,.status-Approved,.status-Present{background:var(--teal-soft);color:#08716d}.status-Pending,.status-Leave{background:#fff1d2;color:#966b12}.status-Rejected,.status-Absent{background:#ffe0da;color:#ae4934}.form{background:var(--white);padding:28px;border:1px solid var(--line);border-radius:16px;display:grid;gap:16px;max-width:700px;box-shadow:var(--shadow)}.form label{display:grid;gap:7px;color:#415466;font-size:13px;font-weight:bold}.form input,.form select,.form textarea,.date-filter input,.date-filter select,td input,td select{padding:11px;border:1px solid #cbd8dc;border-radius:8px;background:#fbfdfd;color:var(--ink);font:inherit}.form input:focus,.form select:focus,.form textarea:focus,.date-filter input:focus,td input:focus,td select:focus{outline:3px solid var(--teal-soft);border-color:var(--teal)}.flash,.result{padding:14px 17px;margin-bottom:20px;background:var(--teal-soft);color:#08716d;border:1px solid #a9e1dc;border-radius:10px}.result{font-size:20px;font-weight:bold}.date-filter{display:flex;align-items:end;gap:10px;margin-bottom:17px}.date-filter label{display:grid;gap:6px;color:#415466;font-size:12px;font-weight:bold}.analytics-toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.analytics-toolbar h2{margin-right:auto}.analytics-toolbar label{display:grid;gap:4px;font-size:11px;font-weight:bold;color:var(--muted)}.analytics-toolbar select{padding:8px;border:1px solid #cbd8dc;border-radius:7px;background:#fff;color:var(--ink)}.chart-info{min-height:20px;color:var(--muted);font-size:13px}.empty-state{text-align:center;color:var(--muted);padding:28px}.table-tools{display:flex;align-items:center;gap:10px;margin-bottom:14px}.table-tools input{max-width:280px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font:inherit}.quick-link{color:var(--teal);font-weight:bold;text-decoration:none}.quick-link:hover{text-decoration:underline}footer{text-align:center;padding:24px;background:var(--ink);color:#9fb2bf;margin-top:30px;font-size:12px}
.attendance-summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.attendance-summary span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:12px}.attendance-summary strong{color:var(--ink);font-size:18px;margin-right:5px}.department-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.mini-stat{background:var(--ink);color:#fff;border-radius:14px;padding:17px;display:grid;gap:4px}.mini-stat span{color:#b7c8d3;font-size:12px;text-transform:uppercase;letter-spacing:1px}.mini-stat strong{font-family:Georgia,serif;font-size:30px}.mini-stat small{color:#82d3cc}.prediction-layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px;align-items:start}.prediction-intro{background:var(--ink);color:#fff;border-radius:16px;padding:30px;min-height:390px;position:relative;overflow:hidden}.prediction-intro:after{content:"";position:absolute;width:190px;height:190px;right:-65px;bottom:-70px;border:28px solid rgba(15,159,154,.35);border-radius:50%}.prediction-intro h2{font:normal 30px/1.1 Georgia,serif;max-width:320px;margin:26px 0 15px}.prediction-intro p{color:#b7c8d3;line-height:1.7;max-width:330px}.model-badge{display:inline-block;padding:6px 10px;border-radius:99px;background:#24535e;color:#83e4dd;font-size:10px;font-weight:bold;letter-spacing:1px}.form-actions{display:flex;gap:10px}.prediction-tip{grid-column:1/-1;padding:16px 20px;background:#fff5df;border:1px solid #f2d28e;border-radius:12px;color:#795717;display:flex;gap:12px;align-items:center}.prediction-tip span{color:#9c7b3b;font-size:13px}.result{margin-top:18px;padding:16px 20px;border-radius:12px;font-size:22px;font-weight:700;border:1px solid transparent;display:block}.result-likely{background:#dff7eb;border-color:#a9e2bf;color:#0f6b3d}.result-unlikely{background:#fde8e8;border-color:#f0b0b0;color:#9a1e1e}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.links{width:100%;overflow:auto}.links a{white-space:nowrap}.grid,.prediction-layout{grid-template-columns:1fr}.department-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){main{width:calc(100% - 28px);margin-top:25px}.page-title,.title-row h1{font-size:29px}.cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}.card strong{font-size:30px}.title-row{align-items:flex-start;flex-direction:column}.date-filter{align-items:stretch;flex-direction:column}.date-filter .btn{width:100%}table{font-size:12px;display:block;overflow-x:auto;white-space:nowrap}.links{display:none}.links.open{display:flex}.nav-toggle{display:block}.brand{font-size:17px}.brand small{font-size:8px}}
.chart-panel{padding:22px 22px 18px}.chart-eyebrow{display:block;color:var(--teal);font-size:10px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}.chart-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px;margin:2px 0 8px}.chart-summary{color:var(--muted);font-size:12px}.chart-switcher{display:flex;gap:4px;padding:3px;background:#edf4f3;border-radius:8px}.chart-switcher .chart-mode{background:transparent;color:var(--muted);padding:6px 9px;font-size:11px;border-radius:6px;box-shadow:none}.chart-switcher .chart-mode:hover,.chart-switcher .chart-mode.active{background:#fff;color:var(--teal);transform:none;box-shadow:0 2px 7px rgba(20,35,59,.1)}.chart-frame{height:270px;position:relative}.chart-frame--donut{height:270px}.chart-info{min-height:18px;margin:8px 0 0;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<nav>
  <div class="brand"><span class="brand-mark">W</span><span>Workforce Hub<small>People operations, simplified</small></span></div>
  <button class="nav-toggle" type="button" aria-label="Toggle navigation">Menu</button>
  <div class="links">
    <a href="/">Dashboard</a><a href="/employees">Employees</a><a href="/leaves">Leaves</a>
    <a href="/attendance">Attendance</a><a href="/departments">Departments</a>
    <a href="/analytics">Analytics</a><a href="/prediction">AI/ML</a>
  </div>
</nav>
<main>
{% with messages=get_flashed_messages() %}
{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer></footer>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script>
const currentPath=window.location.pathname;
document.querySelectorAll('.links a').forEach(link=>{if(link.getAttribute('href')===currentPath||(currentPath.startsWith(link.getAttribute('href'))&&link.getAttribute('href')!=='/'))link.classList.add('active');});
document.querySelector('.nav-toggle').addEventListener('click',()=>document.querySelector('.links').classList.toggle('open'));
</script>
</body>
</html>
