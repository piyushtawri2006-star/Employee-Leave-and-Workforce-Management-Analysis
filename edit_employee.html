{% extends "base.html" %}
{% block content %}
<h1>Edit Employee</h1>
<form method="post" class="form">
<label>Employee Code<input name="employee_code" required value="{{ employee.employee_code if employee else '' }}"></label>
<label>Name<input name="name" required value="{{ employee.name if employee else '' }}"></label>
<label>Email<input type="email" name="email" value="{{ employee.email if employee else '' }}"></label>
<label>Phone<input name="phone" value="{{ employee.phone if employee else '' }}"></label>
<label>Gender<input name="gender" value="{{ employee.gender if employee else '' }}"></label>
<label>Department<select name="department_id" required>{% for d in departments %}<option value="{{d.department_id}}" {% if employee and employee.department_id==d.department_id %}selected{% endif %}>{{d.department_name}}</option>{% endfor %}</select></label>
<label>Designation<input name="designation" value="{{ employee.designation if employee else '' }}"></label>
<label>Joining Date<input type="date" name="joining_date" value="{{ employee.joining_date if employee else '' }}"></label>
<label>Salary<input type="number" step="0.01" name="salary" value="{{ employee.salary if employee else '' }}"></label>
<label>Status<select name="status"><option>Active</option><option>Inactive</option></select></label>
<button class="btn" type="submit">Save</button>
<a class="btn secondary" href="/employees">Cancel</a>
</form>
{% endblock %}
